{% extends 'catalog/base.html' %}

{% block title %}Удаление товара{% endblock %}

{% block content %}

<div class='container'>
    <h1>Удалить</h1>
    <p>Вы уверены, что хотите удалить товар {{ product }}?</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'catalog:list' %}" class="btn btn-secondary">Отмена</a>
    </form>

</div>

{% endblock %}
