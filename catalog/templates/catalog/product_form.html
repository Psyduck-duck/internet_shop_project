{% extends 'catalog/base.html' %}

{% block title %}Форма товара{% endblock %}

{% block content %}

<div class="container">
    <div class="row text-center justify-content-center">
        <form method="POST">
            {% csrf_token %}
<!--            {{ form.non_field_errors }}-->
            {{form.as_p }}
            <div class="conteiner">
                <div class="col-5"></div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{% url 'catalog:list' %}" class="btn btn-secondary">Отмена</a>
                <div class="col-5"></div>
            </div>
        </form>

    </div>
</div>
{% endblock %}
