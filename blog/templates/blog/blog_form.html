{% extends 'catalog/base.html' %}

{% block title %}Форма статьи{% endblock %}

{% block content %}

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Форма статьи</h1>
</div>

<div class="container">
    <div class="row text-start">

        <div class="col-lg-12 col-md-12 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Создайте/редактируйте статью</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="" class="form-floating">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Отмена</a>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
